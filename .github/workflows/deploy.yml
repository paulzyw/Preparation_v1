name: Deploy to Wasmer

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Set up Wasmer CLI
        uses: wasmerio/setup-wasmer@v1

      - name: Validate GitHub Secrets Configuration
        run: |
          if [ -z "$WASMER_TOKEN" ]; then
            echo "::error::WASMER_TOKEN is not configured in your repository secrets! Please go to Settings > Secrets and variables > Actions, and add WASMER_TOKEN with your Wasmer access token."
            exit 1
          else
            echo "WASMER_TOKEN is present and configured."
            export WASMER_TOKEN=$(echo -n "$WASMER_TOKEN" | tr -d '\n\r ')
            echo "=== Diagnostic Debug Info ==="
            echo "Token length: ${#WASMER_TOKEN} characters"
            echo "Running 'wasmer whoami' to verify identity..."
            wasmer whoami || echo "WARNING: wasmer whoami failed to authenticate!"
            echo "================================="
          fi
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}

      - name: Deploy to Wasmer Edge
        run: |
          export WASMER_TOKEN=$(echo -n "$WASMER_TOKEN" | tr -d '\n\r ')
          sed -i "s/version = \".*\"/version = \"0.1.${{ github.run_number }}\"/" wasmer.toml
          wasmer deploy --non-interactive --owner paulzyw02
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}