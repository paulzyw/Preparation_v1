name: Deploy to Wasmer

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Set up Wasmer CLI
        uses: wasmerio/setup-wasmer@v1

      - name: Deploy to Wasmer Edge
        run: wasmer deploy --non-interactive --owner paulzyw02
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}